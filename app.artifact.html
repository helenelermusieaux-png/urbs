<meta name="claude:viewport-fit-sides" content="cover">
<title>Clairière</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: une appli mobile en colonne, en-tête collant (niveau, glands, lucioles), contenu par onglet, barre d'onglets en bas. La forêt est une grille de 6x6 tuiles vue du dessus, façon Caesar III. */
:root{
  --bg:#F4F6F1; --card:#FFFFFF; --ink:#1B2620; --mute:#5E6C63; --line:#E3E8DF;
  --sea:#B9631D; --sea-d:#874510; --on-sea:#FFFFFF;
  --terra:#2E8B4E; --terra-d:#1D6335; --on-terra:#FFFFFF;
  --gold:#F5C14B; --gold-d:#C48F1A; --olive:#58A64F; --olive-d:#3D7A36;
  --wall:#FFF2D8; --roof:#E8695A; --dark:#5B4636; --stone:#BDB8AB; --water:#79CFE6;
  --grass:#94D37E; --grass-d:#6DB55C; --road:#EBD3A0; --road-d:#CDB57E;
  --sea-t:#BDEBFA; --sea-b:#8ED3EA;
  --danger:#C23B30; --ok:#2E7D4F; --shade:rgba(74,59,46,.2);
  --f-d:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif; --f-b:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media not all{:root:not([data-theme="light"]){
  --bg:#0E1512; --card:#161F1A; --ink:#EAF0EA; --mute:#9AA9A0; --line:#25322B;
  --sea:#F0A458; --sea-d:#B0722F; --on-sea:#2A1606;
  --terra:#6FCF84; --terra-d:#3C8F52; --on-terra:#0C2314;
  --gold:#F7CB5B; --gold-d:#C79A24; --olive:#7BC46F; --olive-d:#4C8A44;
  --wall:#F3E6C8; --roof:#EE7D6E; --dark:#3B2E25; --stone:#8F9486; --water:#5CC3DC;
  --grass:#4C7A3E; --grass-d:#3A6030; --road:#7C6F52; --road-d:#625740;
  --sea-t:#1B3A4B; --sea-b:#12293A;
  --danger:#FF7A6E; --ok:#6FCF84; --shade:rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1512; --card:#161F1A; --ink:#EAF0EA; --mute:#9AA9A0; --line:#25322B;
  --sea:#F0A458; --sea-d:#B0722F; --on-sea:#2A1606;
  --terra:#6FCF84; --terra-d:#3C8F52; --on-terra:#0C2314;
  --gold:#F7CB5B; --gold-d:#C79A24; --olive:#7BC46F; --olive-d:#4C8A44;
  --wall:#F3E6C8; --roof:#EE7D6E; --dark:#3B2E25; --stone:#8F9486; --water:#5CC3DC;
  --grass:#4C7A3E; --grass-d:#3A6030; --road:#7C6F52; --road-d:#625740;
  --sea-t:#1B3A4B; --sea-b:#12293A;
  --danger:#FF7A6E; --ok:#6FCF84; --shade:rgba(0,0,0,.4); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:auto}
body{background:var(--bg);color:var(--ink);font-family:var(--f-b);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent;text-wrap:pretty}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button{font-family:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
h1,h2,h3{font-family:var(--f-d);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.app{max-width:520px;margin:0 auto;padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0 110px}

/* en-tête */
.head{position:sticky;top:env(safe-area-inset-top,0px);z-index:31;background:var(--bg);padding:10px 0 10px;display:flex;align-items:center;gap:12px}
.lvl{flex:none;width:46px;height:46px;border-radius:50%;background:var(--sea);color:var(--on-sea);display:grid;place-items:center;font:800 17px var(--f-d);box-shadow:0 3px 0 var(--sea-d)}
.who{flex:1;min-width:0}
.who b{display:block;font:700 13px var(--f-d);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who .bar{margin-top:6px;height:9px}
.pill{display:flex;align-items:center;gap:6px;font:800 14px var(--f-b);background:var(--card);border:2px solid var(--line);border-radius:99px;padding:5px 10px 5px 6px}
.pill svg{width:20px;height:20px;flex:none}

/* briques */
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;padding:16px;margin-top:14px}
.card.flat{border-bottom-width:5px}
.row{display:flex;align-items:center;gap:10px}
.sp{justify-content:space-between}
.mute{color:var(--mute)}
.small{font-size:13px}
.cap{font:800 13px var(--f-b);color:var(--mute)}
.btn{font:800 15px var(--f-b);padding:13px 18px;border-radius:14px;border:0;background:var(--terra);color:var(--on-terra);box-shadow:0 4px 0 var(--terra-d);cursor:pointer;min-height:48px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 var(--terra-d)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.sea{background:var(--sea);color:var(--on-sea);box-shadow:0 4px 0 var(--sea-d)}
.btn.sea:active:not(:disabled){box-shadow:0 1px 0 var(--sea-d)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 3px 0 var(--line)}
.btn.ghost:active:not(:disabled){box-shadow:0 0 0 var(--line)}
.btn.sm{padding:8px 12px;min-height:38px;font-size:13px;border-radius:12px}
.btn.block{display:flex;width:100%}
.bar{height:12px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--olive);min-width:0;transition:width .4s}
.bar.gold>i{background:var(--gold)}
.bar.sea>i{background:var(--sea)}
.chip{display:inline-block;font:800 12.5px var(--f-b);padding:3px 10px;border-radius:99px;--k:var(--sea);color:var(--ink);background:color-mix(in srgb,var(--k) 18%,var(--card));border:1.5px solid color-mix(in srgb,var(--k) 55%,var(--card))}
.k-livre{--k:var(--sea)}.k-musique{--k:var(--terra)}.k-film{--k:var(--gold)}.k-serie{--k:var(--olive)}
.card.okc{border-color:color-mix(in srgb,var(--olive) 60%,var(--line))}
.avl{font:700 9px var(--f-b);fill:var(--mute);text-transform:uppercase;letter-spacing:.06em}.avv{font:800 12px var(--f-b);fill:var(--ink)}
.empty-note{padding:18px;text-align:center;color:var(--mute);border:2px dashed var(--line);border-radius:16px;margin-top:12px}

/* alerte hebdo sport */
.threat{display:flex;gap:14px;align-items:center}
.slots{display:flex;gap:8px}
.slot{width:38px;height:38px;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;color:var(--card)}
.slot.on{background:var(--olive);border:3px solid var(--olive-d);color:#fff}
.slot svg{width:20px;height:20px}
.tone-ok{color:var(--ok)}.tone-warn{color:var(--gold-d)}.tone-bad{color:var(--danger)}
@media not all{:root:not([data-theme="light"]) .tone-warn{color:var(--gold)}}
:root[data-theme="dark"] .tone-warn{color:var(--gold)}

/* forêt */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stat{background:var(--bg);border-radius:14px;padding:8px 10px;min-width:0}
.stat b{display:block;font:800 17px var(--f-d)}
.stat span{font-size:12px;color:var(--mute)}
.city{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;padding:8px;border-radius:16px;background:var(--grass-d)}
.tile{position:relative;aspect-ratio:1;border:0;padding:0;border-radius:9px;background:var(--grass);box-shadow:0 3px 0 var(--grass-d);min-width:0;cursor:pointer;display:block}
.tile svg{width:100%;height:100%;display:block;overflow:visible}
.tile.road{background:var(--road);box-shadow:0 3px 0 var(--road-d);cursor:default}
.tile.road::after{content:"";position:absolute;inset:0;border-radius:9px;background:repeating-linear-gradient(90deg,transparent 0 6px,rgba(255,255,255,.18) 6px 8px)}
.tile.road.v::after{background:repeating-linear-gradient(0deg,transparent 0 6px,rgba(255,255,255,.18) 6px 8px)}
.tile.empty{background:color-mix(in srgb,var(--grass) 70%,transparent);box-shadow:none;border:2px dashed color-mix(in srgb,var(--ink) 30%,transparent);font:800 20px var(--f-b);color:color-mix(in srgb,var(--ink) 55%,transparent)}
.tile.dmg svg{filter:grayscale(.75) brightness(.78)}
.tile.dmg{box-shadow:0 3px 0 var(--grass-d),inset 0 0 0 2px var(--danger)}
.tile .lv{position:absolute;left:0;right:0;bottom:2px;display:flex;justify-content:center;gap:2px}
.tile .lv b{width:5px;height:5px;border-radius:50%;background:var(--gold);box-shadow:0 0 0 1px var(--gold-d)}
svg .sh{fill:var(--shade)}svg .w{fill:var(--wall)}svg .r{fill:var(--roof)}svg .d{fill:var(--dark)}svg .g{fill:var(--gold)}svg .wt{fill:var(--water)}svg .st{fill:var(--stone)}svg .gr{fill:var(--olive)}
svg .wts{stroke:var(--water);fill:none;stroke-width:2.2;stroke-linecap:round}
.log{display:grid;gap:8px;margin-top:10px}
.log div{font-size:13px;color:var(--mute);border-left:3px solid var(--line);padding-left:10px}


/* écran forêt : plein cadre, style jeu */
.stage{position:relative;margin-top:2px;height:max(440px,calc(100dvh - 196px - env(safe-area-inset-top,0px)));border-radius:26px;overflow:hidden;border:3px solid var(--line);box-shadow:0 5px 0 var(--line);background:linear-gradient(var(--sea-t),var(--sea-b))}
.stage::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:radial-gradient(120% 90% at 50% 45%,transparent 55%,rgba(10,30,20,.3))}
.stage #c3slot,.stage .c3{height:100%}
.stage .c3{aspect-ratio:auto;max-height:none;border-radius:0}
.stage .c3btn{top:50%;bottom:auto;right:10px;transform:translateY(-50%);flex-direction:column;z-index:2}
.stage.fb,.stage.fb #c3slot{height:auto!important;min-height:0}
.stage.mini,.stage.mini #c3slot{height:168px!important;min-height:0}.stage.mini{margin-top:0}.stage.mini .c3btn{display:none}
.mini-hit{position:absolute;inset:0;z-index:4;background:transparent;border:0;cursor:pointer;display:flex;align-items:flex-end;justify-content:space-between;padding:10px 14px;text-align:left}
.mini-hit span{font:800 13px var(--f-b);background:color-mix(in srgb,var(--card) 88%,transparent);border:2px solid var(--line);border-radius:99px;padding:4px 12px;color:var(--ink)}
.hl{font:800 24px/1.2 var(--f-d);margin:4px 0 0}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px 6px;text-align:center}
.kpi b{display:block;font:800 26px/1.1 var(--f-d)}.kpi small{font:700 14px var(--f-b);color:var(--mute)}
.kpi span{display:block;margin-top:2px;font:700 12px var(--f-b);color:var(--mute)}
.trow{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:2px solid var(--line)}.trow:first-of-type{border-top:0}
.trow.col{flex-direction:column;align-items:stretch;gap:8px}.trow.col .row{width:100%}
.goalq{display:flex;gap:8px;margin-top:10px}.goalq input{flex:1}
.secbtn{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;padding:0;color:var(--ink);cursor:pointer;text-align:left;min-height:32px}
.step{display:flex;gap:12px;align-items:center;padding:12px 0;border-top:2px solid var(--line)}.step:first-of-type{border-top:0}
.step .tick{flex:none;width:28px;height:28px;border-radius:50%;border:3px solid var(--line);display:grid;place-items:center;font:900 15px var(--f-b);color:#fff}
.step.done .tick{background:var(--olive,#2E8C50);border-color:transparent}
.stage.fb .hud{position:static;padding:10px}
.stage.fb::after{display:none}
.hud{position:absolute;inset:0;z-index:3;display:flex;flex-direction:column;justify-content:space-between;padding:10px;pointer-events:none}
.hud button{pointer-events:auto}
.hud-top{display:flex;gap:6px;flex-wrap:wrap;max-width:calc(100% - 56px)}
.hchip{display:inline-flex;align-items:center;gap:5px;font:800 13px var(--f-b);background:color-mix(in srgb,var(--card) 90%,transparent);border:2px solid var(--line);border-radius:99px;padding:5px 11px;box-shadow:0 3px 0 var(--line);white-space:nowrap}
.hchip.gold{background:color-mix(in srgb,var(--gold) 28%,var(--card));border-color:color-mix(in srgb,var(--gold) 60%,var(--card))}
.hud-bot{background:color-mix(in srgb,var(--card) 92%,transparent);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border:2px solid var(--line);border-bottom-width:5px;border-radius:20px;padding:12px;display:grid;gap:10px}
.hud-bot .bar{height:14px}
.hud-bot .evo{font-size:12.5px;color:var(--mute);margin-top:6px}

/* semaine */
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{display:grid;justify-items:center;gap:5px;font:800 12px var(--f-b);color:var(--mute)}
.wd i{width:100%;max-width:42px;aspect-ratio:1;border-radius:50%;border:3px dashed var(--line);display:grid;place-items:center;color:#fff}
.wd i svg{width:60%;height:60%}
.wd.on i{background:var(--olive);border:3px solid var(--olive-d)}
.wd.now i{border:3px solid var(--terra)}
.wd.now{color:var(--ink)}
.wd.past:not(.on) i{opacity:.5}
.tab{position:relative}
.tab .dot{position:absolute;top:5px;left:calc(50% + 8px);width:10px;height:10px;border-radius:50%;background:var(--gold);border:2px solid var(--card)}
.hchip.ok{background:color-mix(in srgb,var(--olive) 30%,var(--card));border-color:color-mix(in srgb,var(--olive) 65%,var(--card))}
.hchip.warn{background:color-mix(in srgb,var(--gold) 32%,var(--card));border-color:color-mix(in srgb,var(--gold) 65%,var(--card))}
.hchip.bad{background:color-mix(in srgb,var(--danger) 25%,var(--card));border-color:color-mix(in srgb,var(--danger) 60%,var(--card))}
button.hchip{cursor:pointer;color:inherit}
/* forêt isométrique */
.scene{display:block;width:100%;height:auto;border-radius:16px;background:linear-gradient(var(--sea-t),var(--sea-b));user-select:none}
.scene .wv{fill:none;stroke:#fff;stroke-opacity:.45;stroke-width:2;stroke-linecap:round}
.hit{cursor:pointer;outline:none}.hz{fill:transparent}
.hit:hover .hz{fill:rgba(255,255,255,.18)}.hit:focus-visible .hz{stroke:var(--terra);stroke-width:2.5}
.gG1{fill:var(--grass)}.gG2{fill:color-mix(in srgb,var(--grass) 90%,#000)}.gRd{fill:var(--road)}
.eL{fill:color-mix(in srgb,var(--grass-d) 55%,#4a3524)}.eR{fill:color-mix(in srgb,var(--grass-d) 40%,#2e2014)}
.ln{stroke:#fff;stroke-opacity:.35;stroke-width:1.6;stroke-dasharray:4 4}
.plus{fill:none;stroke:color-mix(in srgb,var(--ink) 40%,transparent);stroke-width:1.6;stroke-dasharray:3 3;pointer-events:none}
.plusk{stroke:color-mix(in srgb,var(--ink) 50%,transparent);stroke-width:2;stroke-linecap:round;pointer-events:none}
.pip{fill:var(--gold);stroke:var(--gold-d);stroke-width:1;pointer-events:none}
.dmgb{filter:grayscale(.8) brightness(.78)}
.wA{fill:var(--wall)}.wB{fill:color-mix(in srgb,var(--wall) 80%,#25405a)}.wC{fill:color-mix(in srgb,var(--wall) 62%,#25405a)}
.rA{fill:var(--roof)}.rB{fill:color-mix(in srgb,var(--roof) 86%,#fff)}.rC{fill:color-mix(in srgb,var(--roof) 72%,#2a1410)}
.sA{fill:var(--stone)}.sB{fill:color-mix(in srgb,var(--stone) 82%,#25405a)}.sC{fill:color-mix(in srgb,var(--stone) 64%,#25405a)}
.gA{fill:var(--gold)}.gB{fill:color-mix(in srgb,var(--gold) 88%,#fff)}.gC{fill:color-mix(in srgb,var(--gold) 70%,#3a2a00)}
.iD{fill:var(--dark)}.iW{fill:var(--water)}.iG{fill:var(--olive)}
.iJ{fill:none;stroke:var(--water);stroke-width:2.2;stroke-linecap:round}
.iPo{fill:var(--dark);stroke:var(--dark);stroke-width:1.8}


.c3{position:relative;width:100%;aspect-ratio:1/1;max-height:68vh;border-radius:16px;overflow:hidden;background:linear-gradient(var(--sea-t),var(--sea-b));touch-action:pan-y;user-select:none;-webkit-user-select:none}
.c3 canvas{display:block;width:100%;height:100%;cursor:grab;outline:none}
.c3btn{position:absolute;right:8px;bottom:8px;display:flex;gap:6px}
.c3btn button{width:38px;height:38px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--ink);font:800 20px var(--f-b);cursor:pointer;display:grid;place-items:center;padding:0;box-shadow:0 3px 0 var(--line)}
.c3btn button:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}

.friends{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}.chip.off{opacity:.75}
/* listes & formulaires */
.goal{display:grid;gap:10px}
.goal h3{font:700 15px var(--f-b);letter-spacing:0}
.stepper{display:flex;gap:8px}
.stepper .btn{min-width:48px}
label.f{display:grid;gap:5px;font-weight:700;font-size:13px}
input,select,textarea{font:500 16px var(--f-b);color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:12px;padding:11px 12px;width:100%;min-width:0}
textarea{resize:vertical;min-height:70px}
.form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px}
.seg .btn{flex:none}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mtile{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;min-width:0}
.mtile b{display:block;font:800 22px var(--f-d)}
.mtile .dl{font-size:13px;font-weight:700}
.macros{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.macros div{text-align:center;background:var(--bg);border-radius:12px;padding:8px 4px}
.macros b{display:block;font:800 16px var(--f-d)}
.macros span{font-size:11px;color:var(--mute)}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:2px solid var(--line)}
.item:first-child{border-top:0}
.item .grow{flex:1;min-width:0}
.item h4{margin:0;font-size:15px;overflow-wrap:anywhere}
.x{background:none;border:0;color:var(--mute);font-size:13px;font-weight:700;text-decoration:underline;cursor:pointer;padding:6px}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
th,td{padding:8px 10px;text-align:right;border-bottom:2px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{color:var(--mute);font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.stars{display:flex;gap:4px}
.stars button{font-size:26px;line-height:1;background:none;border:0;cursor:pointer;color:var(--line);padding:4px}
.stars button.on{color:var(--gold)}
.disc{font-size:12px;color:var(--mute);margin-top:10px}
.lock{opacity:.55}

/* barre d'onglets */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--card);border-top:2px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs div{max-width:520px;margin:0 auto;display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:2px}
.tab{background:none;border:0;border-radius:14px;padding:6px 0;display:grid;justify-items:center;gap:2px;font:700 10.5px var(--f-b);white-space:nowrap;letter-spacing:-.1px;color:var(--mute);cursor:pointer;min-height:52px}
.tab svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--terra);background:color-mix(in srgb,var(--terra) 12%,var(--card))}
@media not all{:root:not([data-theme="light"]) .tab[aria-current="page"]{color:var(--terra)}}

/* feuille */
#sheet{position:fixed;inset:0;z-index:60}
.sh-bg{position:absolute;inset:0;background:rgba(8,16,22,.55)}

function burst(n,cx,cy){
  if(REDUCED)return;
  const cols=["var(--gold)","var(--terra)","var(--sea)","var(--olive)","#F4A6B8"];
  for(let i=0;i<n;i++){
    const e=document.createElement("i"),sz=6+Math.random()*7;
    e.style.cssText="position:fixed;left:"+cx+"px;top:"+cy+"px;width:"+sz+"px;height:"+sz*.6+"px;background:"+cols[i%5]+";border-radius:2px;z-index:90;pointer-events:none";
    document.body.appendChild(e);
    const a=Math.random()*Math.PI*2,v=90+Math.random()*180,dx=Math.cos(a)*v,dy=Math.sin(a)*v-120;
    e.animate([{transform:"translate(0,0) rotate(0deg)",opacity:1},{transform:"translate("+dx+"px,"+(dy+260)+"px) rotate("+Math.round(Math.random()*720-360)+"deg)",opacity:0}],{duration:900+Math.random()*500,easing:"cubic-bezier(.2,.7,.4,1)"}).onfinish=()=>e.remove();
  }
}

function makeEvent(week,sessions){
  const k=["feu","pillage","peste"][Math.floor(Math.random()*3)];
  const cand=[];S.grid.forEach((b,i)=>{if(b&&!b.x)cand.push(i)});
  const n=k==="pillage"?1:2,hit=[];
  for(let j=0;j<n&&cand.length;j++){const i=cand.splice(Math.floor(Math.random()*cand.length),1)[0];S.grid[i].x=1;hit.push(CAT[S.grid[i].t].n)}
  let lost=0;if(k==="pillage"){lost=Math.min(S.den,40);S.den-=lost}
  const ev={k,week,s:sessions,hit,lost};
  S.log.unshift({d:today(),t:evText(ev).title});S.log=S.log.slice(0,12);
  return ev;
}
function evText(ev){
  const titles={feu:"Orage sur la forêt",pillage:"Corbeaux voleurs",peste:"Tempête de vent"};
  const what=ev.hit.length?ev.hit.join(" et "):"aucun aménagement";
  const body={feu:"La foudre a secoué : "+what+".",pillage:"Des corbeaux emportent "+ev.lost+" glands et bousculent : "+what+".",peste:"Le vent a malmené : "+what+"."}[ev.k];
  return {title:titles[ev.k],body:body};
}
function rollWeek(){
  const cur=monday();if(S.weekKey>=cur)return;
  let k=S.weekKey,first=true,ev=0;
  while(k<cur){
    const sessions=first?S.sport.length:0;
    S.streak=first&&S.perfect===k?S.streak+1:0;
    if(sessions<3&&ev<2){S.pending.push(makeEvent(k,sessions));ev++}
    first=false;k=addDays(k,7);
  }
  S.weekKey=cur;S.sport=[];S.bonus=[];S.comp.forEach(g=>{g.d=0;g.p=0});S.sportP=0;S.goals=[];persist();
}
function repairOne(){
  let best=-1;S.grid.forEach((b,i)=>{if(b&&b.x&&(best<0||CAT[b.t].pr>CAT[S.grid[best].t].pr))best=i});
  if(best<0)return null;S.grid[best].x=0;return CAT[S.grid[best].t].n;
}

async function cravAI(){

const lastVal=k=>{for(let i=S.body.length-1;i>=0;i--)if(S.body[i][k]!=null)return S.body[i][k];return null};
const firstVal=k=>{for(let i=0;i<S.body.length;i++)if(S.body[i][k]!=null)return S.body[i][k];return null};

function spark(){
  const pts=S.body.filter(b=>b.poids!=null).slice(-14);
  if(pts.length<2)return '<div class="empty-note">Ajoute au moins deux pesées pour voir ta courbe.</div>';
  const v=pts.map(p=>p.poids),mn=Math.min.apply(null,v),mx=Math.max.apply(null,v),rg=(mx-mn)||1;
  const X=i=>20+i*(260/(pts.length-1)),Y=x=>14+(1-(x-mn)/rg)*52;

/* avatar : silhouette qui suit les mesures */
function avSmooth(P,closed){
  const n=P.length,g=i=>P[(i+n)%n];let d="M"+P[0][0].toFixed(1)+","+P[0][1].toFixed(1);
  const m=closed?n:n-1;
  for(let i=0;i<m;i++){
    const a=closed?g(i-1):P[Math.max(0,i-1)],b=g(i),c=g(i+1),e=closed?g(i+2):P[Math.min(n-1,i+2)];
    const t=.18;
    d+="C"+(b[0]+(c[0]-a[0])*t).toFixed(1)+","+(b[1]+(c[1]-a[1])*t).toFixed(1)+" "+(c[0]-(e[0]-b[0])*t).toFixed(1)+","+(c[1]-(e[1]-b[1])*t).toFixed(1)+" "+c[0].toFixed(1)+","+c[1].toFixed(1);
  }
  return d+(closed?"Z":"");
}
function avShape(get){
  const H=Math.max(140,Math.min(210,get("taille")||170)),po=get("poids"),th=get("taille");
  const bmi=po&&th?po/Math.pow(th/100,2):22,f=Math.pow(Math.max(.7,Math.min(1.6,bmi/22)),.8);
  const D={poitrine:92,ventre:78,hanches:96,bras:29,cuisse:54},v=k=>get(k)||D[k]*f;
  const k=330/H,cx=130,top=26,Y=q=>top+q*330,Wd=c=>c*.35*k;
  const cw=Wd(v("poitrine")),ww=Wd(v("ventre")),hw=Wd(v("hanches")),sw=cw+8*k;
  const ad=Math.max(4.5,v("bras")/Math.PI)*k,td=Math.max(8,v("cuisse")/Math.PI)*k;
  const torso=avSmooth([[cx+4.5*k,Y(.155)],[cx+sw/2,Y(.19)],[cx+cw/2,Y(.285)],[cx+ww/2,Y(.4)],[cx+hw/2,Y(.5)],[cx+hw/2*.6,Y(.525)],[cx-hw/2*.6,Y(.525)],[cx-hw/2,Y(.5)],[cx-ww/2,Y(.4)],[cx-cw/2,Y(.285)],[cx-sw/2,Y(.19)],[cx-4.5*k,Y(.155)]],true);
  const leg=d=>{const o=cx+d*(hw/2-.3*k),i=o-d*td,kn=(o+i)/2-d*1.2*k,kw=td*.62,an=kn-d*.8*k,aw=5.2*k;
    return avSmooth([[o,Y(.5)],[kn+d*kw/2,Y(.74)],[an+d*aw/2,Y(.97)],[an-d*aw/2,Y(.97)],[kn-d*kw/2,Y(.74)],[i,Y(.5)]],true)};
  const short=d=>{const o=cx+d*(hw/2-.3*k),i=o-d*td;return avSmooth([[o+d*.6*k,Y(.5)],[o-d*.1*k,Y(.6)],[i+d*.1*k,Y(.615)],[i-d*.5*k,Y(.5)]],true)};
  const arm=d=>{const xs=cx+d*(sw/2-ad*.15),xw=xs+d*6*k;
    return avSmooth([[xs+d*ad*.55,Y(.2)],[xw+d*2.8*k,Y(.5)],[xw-d*2.8*k,Y(.5)],[xs-d*ad*.45,Y(.23)]],true)};
  return {torso,legs:[leg(1),leg(-1)],shorts:[short(1),short(-1)],arms:[arm(1),arm(-1)],r:.065*H*k*.98,cx,hy:top+.065*H*k*.98,k,Y,cw,ww,hw,sw,ad,td};
}

  const val=(k,u)=>lastVal(k)!=null?fn(lastVal(k))+' '+u:'—',Y=cur.Y,c=cur;

    L(Y(.32),c.cx-c.sw/2-8,62,4,"Bras",val("bras","cm"))+L(Y(.62),c.cx-c.hw/2+4,62,4,"Cuisse",val("cuisse","cm"));
  return '<svg viewBox="0 0 260 400" style="width:100%;max-width:340px;height:auto;display:block;margin:0 auto" role="img" aria-label="Avatar construit à partir de tes mesures">'+

    '<path d="M'+(c.cx-c.k*4.5)+','+c.Y(.158)+' Q'+c.cx+','+(c.Y(.215))+' '+(c.cx+c.k*4.5)+','+c.Y(.158)+'" fill="none" stroke="var(--olive-d)" stroke-width="2.4"/>'+
    '<circle cx="'+c.cx+'" cy="'+c.hy+'" r="'+c.r+'" fill="'+sk+'" stroke="'+sk+'"/></g>'+
    '<g fill="#3a2a20"><circle cx="'+(c.cx-c.r*.36)+'" cy="'+(c.hy+c.r*.05)+'" r="'+(c.r*.075)+'"/><circle cx="'+(c.cx+c.r*.36)+'" cy="'+(c.hy+c.r*.05)+'" r="'+(c.r*.075)+'"/></g>'+
    '<path d="M'+(c.cx-c.r*.3)+','+(c.hy+c.r*.38)+' Q'+c.cx+','+(c.hy+c.r*.62)+' '+(c.cx+c.r*.3)+','+(c.hy+c.r*.38)+'" fill="none" stroke="#3a2a20" stroke-width="1.8" stroke-linecap="round"/>'+
    '<g transform="translate('+c.cx+','+(c.hy-c.r)+')"><path d="M0,2 C-2,-8 -12,-14 -18,-12 C-16,-4 -8,2 0,2Z" fill="var(--olive)"/><path d="M0,2 C2,-10 10,-16 17,-15 C16,-6 8,1 0,2Z" fill="var(--olive-d)"/></g>'+

}

const MKEY="urbs-mistral";
const getKey=()=>{try{return localStorage.getItem(MKEY)||""}catch(e){return ""}};
const engine=()=>caps.sample&&caps.img?"claude":getKey()?"mistral":"";
const MERR={auth:"Clé Mistral refusée. Vérifie-la dans les réglages.",rate:"Mistral refuse la demande (limite ou plan non activé).",network:"Impossible de joindre Mistral depuis ici.",parse:"Réponse illisible, réessaie.",http:"Mistral n'a pas répondu."};
async function mistralJSON(prompt,dataUrl,signal){
  const key=getKey();let last;
  for(const model of ["mistral-small-latest","pixtral-12b-latest"]){
    let r;
    try{r=await fetch("https://api.mistral.ai/v1/chat/completions",{method:"POST",signal,headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify({model,temperature:.2,response_format:{type:"json_object"},messages:[{role:"user",content:dataUrl?[{type:"text",text:prompt},{type:"image_url",image_url:dataUrl}]:prompt}]})})}
    catch(e){if(e&&e.name==="AbortError")throw {code:"cancelled"};throw {code:"network"}}
    if(!r.ok){
      let det="";try{const j=await r.json();det=String(j.message||(j.error&&j.error.message)||j.detail||JSON.stringify(j)).slice(0,160)}catch(_){}
      last={code:r.status===401||r.status===403?"auth":r.status===429?"rate":"http",status:r.status,detail:det};
      if(last.code==="auth")throw last;
      continue;
    }
    try{const j=await r.json(),t=j.choices[0].message.content;return JSON.parse(typeof t==="string"?t:t.map(x=>x.text||"").join(""))}catch(e){last={code:"parse"}}
  }
  throw last||{code:"http"};
}

async function shrink(file){
  const bmp=await createImageBitmap(file);
  const k=Math.min(1,1024/Math.max(bmp.width,bmp.height));
  const c=document.createElement("canvas");c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
  c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
  const blob=await new Promise(r=>c.toBlob(r,"image/jpeg",.82));
  return {blob,url:c.toDataURL("image/jpeg",.6),big:c.toDataURL("image/jpeg",.82)};
}

/* synchronisation MongoDB (serveur perso) */
const SYNC_URL="https://urbs-api.onrender.com",SKEY="urbs-sync";
const syncCode=()=>{try{return localStorage.getItem(SKEY)||""}catch(e){return ""}};
const rs={st:syncCode()?"wait":"off",t:0};
let remoteT=null;
async function remote(method,code,body){
  const ctl=new AbortController(),to=setTimeout(()=>ctl.abort(),80000);
  try{
    const r=await fetch(SYNC_URL+"/api/save",{method,signal:ctl.signal,headers:{"x-app-code":code,"Content-Type":"application/json"},body:body?JSON.stringify(body):undefined});
    let j={};try{j=await r.json()}catch(_){}
    return {status:r.status,j};
  }catch(e){return {status:0,j:{}}}
  finally{clearTimeout(to)}
}
async function pushRemote(){
  const c=syncCode();if(!c)return;
  rs.st="wait";
  const r=await remote("PUT",c,{doc:S});
  rs.st=r.status===200?"ok":r.status===401?"auth":r.status===409?"newer":"err";if(rs.st==="ok")rs.t=Date.now();
  refreshSyncNote();
}
async function pullRemote(){
  const c=syncCode();if(!c)return;
  rs.st="wait";refreshSyncNote();
  const r=await remote("GET",c);
  if(r.status===200){
    const d=r.j&&r.j.doc;
    if(d&&r.j.upd>(S.upd||0)&&Array.isArray(d.grid)){S=d;migrate();rollWeek();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();toast("Données récupérées du serveur");rs.st="ok";rs.t=Date.now()}
    else await pushRemote();
  }else rs.st=r.status===401?"auth":"err";
  refreshSyncNote();
}
function syncText(){
  if(rs.st==="off")return "Synchronisation désactivée.";
  if(rs.st==="ok")return "Synchronisé"+(rs.t?" à "+new Date(rs.t).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"}):"")+".";
  if(rs.st==="wait")return "Synchronisation en cours… le serveur gratuit peut mettre une minute à se réveiller.";
  if(rs.st==="auth")return "Code refusé par le serveur.";
  if(rs.st==="newer")return "Le serveur a des données plus récentes. Recharge la page pour les récupérer.";
  return "Serveur injoignable pour l'instant. Tes données restent sur ce téléphone.";
}

async function syncConnect(code){

  if(r.status===401){if(st())st().innerHTML='<span class="tone-bad" style="font-weight:700">Code refusé.</span>';return}
  if(r.status!==200){if(st())st().innerHTML='<span class="tone-bad" style="font-weight:700">Serveur injoignable pour l\'instant. Réessaie dans un moment.</span>';return}
  try{localStorage.setItem(SKEY,code)}catch(e){toast("Impossible d'enregistrer ici");return}

    return;
  }
  await pushRemote();closeSheet();render();toast(rs.st==="ok"?"Synchronisation activée":"Activée, serveur injoignable");
}
async function syncPull(){
  const r=await remote("GET",syncCode());

function backupData(){
  const data=JSON.stringify(S),name="clairiere-sauvegarde-"+today()+".json";
  const done=m=>{S.lastBackup=today();persist();closeSheet();render();toast(m)};
  if(caps.dl){caps.dl.save({filename:name,data}).then(()=>done("Sauvegarde enregistrée")).catch(e=>{if(!e||e.code!=="declined")toast("Sauvegarde impossible ici")});return}

function dlSave(filename,data,mime){
  if(caps.dl)return caps.dl.save({filename,data});
  return new Promise((ok,ko)=>{try{const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([data],{type:mime||"text/csv;charset=utf-8"}));a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);ok()}catch(e){ko(e)}});
}
const EMOS=["Stress","Fatigue","Ennui","Tristesse","Colère","Frustration","Anxiété","Solitude","Récompense","Habitude"];
const slot=t=>{const h=parseInt(String(t).slice(0,2),10);return h<6?"Nuit":h<12?"Matin":h<18?"Après-midi":"Soir"};
function top(arr){const c={};arr.forEach(x=>c[x]=(c[x]||0)+1);const e=Object.entries(c).sort((a,b)=>b[1]-a[1]);return e}
function cravStats(list){
  return {n:list.length,k:Math.round(list.reduce((a,c)=>a+(c.kcal||0),0)),emo:top([].concat(...list.map(c=>c.emo||[]))),slot:top(list.map(c=>slot(c.time)))};
}
function exportBilan(){
  const rows=[["BILAN DE SUIVI — généré le "+fmt(today(),{day:"numeric",month:"long",year:"numeric"})],["Mesures saisies par la personne. Calories et nutriments estimés par IA à partir de photos ou de descriptions orales : valeurs indicatives. Les craquages et émotions sont déclarés par la personne."],[],["MESURES CORPORELLES"],["Date","Poids (kg)","Taille (cm)","Tour de taille (cm)","Hanches (cm)","Poitrine (cm)","Bras (cm)","Cuisse (cm)","IMC"]];
  S.body.forEach(b=>{const i=b.poids&&b.taille?b.poids/Math.pow(b.taille/100,2):null;rows.push([b.date,fn(b.poids),fn(b.taille),fn(b.ventre),fn(b.hanches),fn(b.poitrine),fn(b.bras),fn(b.cuisse),fn(i)])});
  rows.push([],["TOTAUX PAR JOUR"],["Date","Repas","kcal","Protéines (g)","Glucides (g)","Lipides (g)","Fibres (g)"]);
  const ds=Array.from(new Set(S.meals.map(m=>m.date))).sort();
  ds.forEach(d=>{const ms=dayMeals(d),t=sumM(ms);rows.push([d,ms.length,Math.round(t.k),Math.round(t.p),Math.round(t.g),Math.round(t.l),Math.round(t.f)])});
  rows.push([],["JOURNAL DES REPAS"],["Date","Heure","Moment","Plat","kcal","Protéines (g)","Glucides (g)","Lipides (g)","Fibres (g)"]);
  S.meals.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(m=>rows.push([m.date,m.time,m.type,m.nom,Math.round(m.kcal||0),Math.round(m.p||0),Math.round(m.g||0),Math.round(m.l||0),Math.round(m.f||0)]));
  rows.push([],["CRAQUAGES ET ENVIES HORS REPAS — SYNTHÈSE PAR SEMAINE"],["Semaine du","Nombre","kcal estimées","Émotions les plus citées","Moment le plus fréquent"]);
  const wk={};S.cravings.forEach(c=>{const w=monday(c.date);(wk[w]=wk[w]||[]).push(c)});
  Object.keys(wk).sort().forEach(w=>{const st=cravStats(wk[w]);rows.push([w,st.n,st.k,st.emo.slice(0,3).map(e=>e[0]+" ("+e[1]+")").join(", "),st.slot[0]?st.slot[0][0]:""])});
  const all=cravStats(S.cravings);
  rows.push([],["Émotions associées (total)"],["Émotion","Fois"]);all.emo.forEach(e=>rows.push([e[0],e[1]]));
  rows.push([],["JOURNAL DES CRAQUAGES"],["Date","Heure","Ce qui a été mangé","kcal estimées","Émotions","Déclencheur noté"]);
  S.cravings.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(c=>rows.push([c.date,c.time,c.nom,Math.round(c.kcal||0),(c.emo||[]).join(", "),c.trig||""]));
  if(S.bilans&&S.bilans.length){rows.push([],["BILANS ÉNERGIE (questionnaires auto-évalués, tous les 3 mois)"],["Date","Questionnaire","Score","Sur","Lecture"]);
    S.bilans.slice().sort((a,b)=>a.date.localeCompare(b.date)).forEach(b=>{const q=QS[b.kind];if(q)rows.push([b.date,q.titre,b.score,q.max,q.interp(b.score).t])})}
  dlSave("bilan-sante-"+today()+".csv",csv(rows)).then(()=>toast("Bilan enregistré")).catch(e=>{if(!e||e.code!=="declined")toast("Export impossible ici")});
}

/* ---------- actions ---------- */
function act(a,x,y,el){
  switch(a){
  case "tab":tab=x;render();window.scrollTo(0,0);break;
  case "close":closeSheet();break;
  case "mkey":sheetMistral();break;
  case "mkeysave":{const k=val("mk").trim();if(k){try{localStorage.setItem(MKEY,k)}catch(e){toast("Impossible d'enregistrer la clé ici");return}}closeSheet();render();toast(k?"Clé enregistrée":"Rien à enregistrer");break}
  case "mkeydel":{try{localStorage.removeItem(MKEY)}catch(e){}closeSheet();render();break}
  case "tile":sheetTile(+x);break;
  case "amenager":{const N=GN(),c=(N-1)/2;let best=-1,bd=1e9;S.grid.forEach((b,i)=>{if(!b&&!isRoad(i)){const d=Math.hypot(i%N-c,Math.floor(i/N)-c);if(d<bd){bd=d;best=i}}});if(best>=0)sheetTile(best);break}
  case "build":{const c=CAT[y];if(S.den<c.c)return;S.den-=c.c;S.grid[+x]={t:y,l:1,x:0};S.log.unshift({d:today(),t:c.n+" installé"});S.log=S.log.slice(0,12);persist();closeSheet();render();toast(c.n+" installé !");break}
  case "upgrade":{const b=S.grid[+x],c=upCost(b.t,b.l);if(S.den<c)return;S.den-=c;b.l++;persist();render();sheetTile(+x);toast("Niveau "+b.l);break}
  case "repair":{const b=S.grid[+x],c=repCost(b.t,b.l);if(S.den<c)return;S.den-=c;b.x=0;persist();render();sheetTile(+x);toast("Aménagement remis en état");break}
  case "c3rot":C3.azT+=(+x)*Math.PI/4;C3.dirty=true;break;
  case "c3zoom":C3.rad=Math.max(C3.rmin,Math.min(C3.rmax,C3.rad*(+x>0?.8:1.25)));C3.dirty=true;break;
  case "sport":act("sportlog","Salle de sport");break;
  case "sportlog":{
    S.sport.push({date:today(),type:x});
    let m="";
    if(S.sport.length>S.sportP){S.sportP=S.sport.length;if(S.sportP===3)gain(40,40,1,"Triomphe !");else gain(15,10,0,x+".")}
    const r=repairOne();if(r)m=" "+r+" est remis en état.";
    checkPerfect();persist();closeSheet();render();if(m)setTimeout(()=>toast("Remise en état :"+m),2400);break}
  case "cplus":{const g=S.comp.find(q=>q.id===x);if(g&&g.d<g.n){g.d++;if(g.d>g.p){g.p=g.d;if(g.d===g.n)gain(15,8,0,g.t+" : objectif atteint !");else gain(5,3,0,g.t+".")}persist();render()}break}
  case "cminus":{const g=S.comp.find(q=>q.id===x);if(g&&g.d>0){g.d--;persist();render()}break}
  case "bonus":{
    S.bonus=S.bonus||[];
    if(S.bonus.includes(today())){closeSheet();toast("Bonus déjà pris aujourd’hui.");break}
    S.bonus.push(today());gain(5,3,0,"Petit Bambou.");persist();closeSheet();render();break}
  case "sundo":if(S.sport.length){S.sport.pop();persist();render()}break;
  case "gok":{const g=S.goals.find(q=>q.id===x);if(g){g.s=1;if(!g.p){g.p=1;gain(25,18,1,"Objectif validé !")}checkPerfect();persist();render()}break}
  case "gno":{const g=S.goals.find(q=>q.id===x);if(g){g.s=-1;persist();render()}break}
  case "gres":{const g=S.goals.find(q=>q.id===x);if(g){g.s=0;persist();render()}break}
  case "goaledit":sheetGoal(x);break;
  case "goalsave":{const t=val("gt").trim();if(!t){toast("Donne un nom à l'objectif");return}
    if(x){const g=S.goals.find(q=>q.id===x);g.t=t}else if(S.goals.length>=3){toast("3 objectifs perso maximum");return}else{S.goals.push({id:"g"+uid(),t:t,s:0,p:0});gain(6,0,0,"Objectif ajouté.")}
    persist();closeSheet();render();break}
  case "goaldel":S.goals=S.goals.filter(q=>q.id!==x);persist();closeSheet();render();break;
  case "mealmanual":sheetMealForm();break;
  case "optbil":{S.opts=S.opts||{};S.opts.bilans=!S.opts.bilans;if(!S.opts.bilans&&tab==="energie")tab="today";persist();render();toast(S.opts.bilans?"Onglet Énergie activé":"Onglet Énergie masqué");break}
  case "qstart":sheetQ(x);break;
  case "qa":{const i=+x,v=+y;window.__q.ans[i]=v;qPaint();break}
  case "qsave":{const q=QS[window.__q.k];if(window.__q.ans.filter(a=>a!=null).length<q.items.length){toast("Réponds à toutes les questions");return}
    const sc=window.__q.ans.reduce((a,b)=>a+b,0);S.bilans.push({id:uid(),date:today(),kind:q.id,score:sc,ans:window.__q.ans.slice()});
    gain(10,5,0,"Bilan fait.");persist();closeSheet();render();break}
  case "qdel":S.bilans=S.bilans.filter(b=>b.id!==x);persist();render();break;
  case "hide":{S.opts=S.opts||{};S.opts.hide=!S.opts.hide;persist();render();toast(S.opts.hide?"Mode discret : chiffres masqués":"Chiffres affichés");break}
  case "sec":secOpen[x]=!secOpen[x];render();break;
  case "mealadd":sheetMealAdd();break;
  case "goalquick":{const t=val("gq").trim();if(!t){toast("Écris ton objectif");return}if(S.goals.length>=3){toast("3 objectifs maximum");return}S.goals.push({id:"g"+uid(),t:t,s:0,p:0});gain(6,0,0,"Objectif ajouté.");persist();render();break}
  case "cravnew":sheetCrav();break;
  case "emo":{const i=window.__emo.indexOf(x);if(i>=0)window.__emo.splice(i,1);else window.__emo.push(x);emoPaint();break}
  case "cravai":cravAI();break;
  case "cravsave":{const txt=val("v_txt").trim(),nom=val("c_nom").trim()||txt.slice(0,50);if(!nom&&!(window.__emo||[]).length){toast("Dis ou écris ce qui s'est passé.");return}
    S.cravings.push({id:uid(),date:today(),time:nowHM(),txt:txt.slice(0,500),nom:nom||"Craquage",kcal:num(val("c_kcal"))||0,emo:(window.__emo||[]).slice(),trig:window.__trig||""});
    window.__trig="";persist();closeSheet();render();toast("Noté. Merci de l'avoir dit.");break}
  case "cravdel":S.cravings=S.cravings.filter(c=>c.id!==x);persist();render();break;
  case "mealvoice":if(!engine())sheetMistral();else sheetVoice();break;
  case "voicego":voiceToggle();break;
  case "voiceok":analyseText();break;
  case "mealsave":{const nom=val("m_nom").trim()||"Repas";const k=num(val("m_kcal"));if(k==null){toast("Indique les calories");return}
    S.meals.push({id:uid(),date:today(),time:nowHM(),type:val("m_type"),nom:nom,kcal:k,p:num(val("m_p"))||0,g:num(val("m_g"))||0,l:num(val("m_l"))||0,f:num(val("m_f"))||0});
    gain(3,2);persist();closeSheet();render();break}
  case "mealdel":S.meals=S.meals.filter(m=>m.id!==x);persist();render();break;
  case "bodyadd":sheetBody();break;
  case "bodysave":{
    const e={date:val("b_date")||today(),poids:num(val("b_poids")),taille:num(val("b_taille")),ventre:num(val("b_ventre")),hanches:num(val("b_hanches")),poitrine:num(val("b_poitrine")),bras:num(val("b_bras")),cuisse:num(val("b_cuisse"))};
    if(MET.concat([["taille"]]).every(m=>e[m[0]]==null)){toast("Renseigne au moins une mesure");return}
    S.body=S.body.filter(b=>b.date!==e.date);S.body.push(e);S.body.sort((a,b)=>a.date.localeCompare(b.date));
    gain(10,5,0,"Mesure notée.");const firstM=S.body.length===1&&!(S.opts&&S.opts.hint);if(firstM){S.opts=S.opts||{};S.opts.hint=1}persist();closeSheet();render();if(firstM)setTimeout(()=>toast("Astuce : l'œil en haut masque tes chiffres quand tu montres l'app"),2400);break}
  case "bodydel":S.body=S.body.filter(b=>b.date!==x);persist();render();break;
  case "export":exportBilan();break;
  case "backup":backupData();break;
  case "welcome":S.welcomed=1;persist();closeSheet();if(x==="goals"){tab="today";render();sheetGoal("")}break;
  case "backuplater":S.backupSnooze=today();persist();closeSheet();break;
  case "syncopen":sheetSync();break;
  case "syncsave":{const c=val("sc").trim();if(!c){toast("Entre ton code");return}syncConnect(c);break}
  case "syncpull":syncPull();break;
  case "syncpush":syncPush();break;
  case "syncoff":{try{localStorage.removeItem(SKEY)}catch(e){}rs.st="off";closeSheet();render();break}
  case "lfilter":lfilter=x;render();break;
  case "leisureadd":sheetLeisure();break;
  case "star":{window.__rate=+x;document.querySelectorAll("#stars button").forEach((b,i)=>b.classList.toggle("on",i<+x));break}
  case "leisuresave":{const t=val("l_title").trim();if(!t){toast("Donne un titre");return}
    const st=val("l_st");S.leisure.push({id:uid(),date:today(),kind:val("l_kind"),title:t,status:st,rating:window.__rate||0,note:val("l_note").trim()});
    if(st==="fini")gain(14,9,0,"Terminé !");else gain(4,3);persist();closeSheet();render();break}
  case "leisurefin":{const q=S.leisure.find(l=>l.id===x);if(q){q.status="fini";q.date=today();gain(10,6,0,"Terminé !");persist();render()}break}
  case "leisuredel":S.leisure=S.leisure.filter(l=>l.id!==x);persist();render();break;
  case "series":sheetSeries();break;
  case "serie":sheetSerie(x);break;
  case "ep":{const n=+y;if(S.eps[x+n])sheetEp(x,n);else if(S.reels<1)toast("Il te faut une luciole");else genEp(x,n);break}
  case "ackevent":S.pending.shift();persist();closeSheet();render();if(S.pending.length)sheetPending();break;
  }
}
document.addEventListener("click",e=>{const el=e.target.closest("[data-act]");if(!el||el.disabled)return;act(el.dataset.act,el.dataset.a,el.dataset.b,el)});
document.addEventListener("change",e=>{if(e.target&&e.target.id==="restore"&&e.target.files&&e.target.files[0]){const f=e.target.files[0];e.target.value="";restoreData(f);return}if(e.target&&(e.target.id==="photo"||e.target.id==="photo2")&&e.target.files&&e.target.files[0]){const f=e.target.files[0];e.target.value="";analyseMeal(f)}});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#sheet").hidden)closeSheet();if((e.key==="Enter"||e.key===" ")&&e.target.getAttribute&&e.target.getAttribute("role")==="button"&&e.target.dataset&&e.target.dataset.act){e.preventDefault();act(e.target.dataset.act,e.target.dataset.a,e.target.dataset.b,e.target)}});

/* ---------- démarrage ---------- */
function migrate(){const f=fresh();if(S.welcomed===undefined&&(S.xp>0||(S.body&&S.body.length)||(S.meals&&S.meals.length)))S.welcomed=1;Object.keys(f).forEach(k=>{if(S[k]===undefined)S[k]=f[k]});S.grid.forEach(b=>{if(b&&MAPK[b.t])b.t=MAPK[b.t]});growIfNeeded()}
async function boot(){
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
  S=loadLocal()||fresh();migrate();rollWeek();render();
  if(S.pending.length)sheetPending();
  const C=window.claude;
  const use=C&&C.use?n=>C.use(n).catch(()=>null):async()=>null;
  const r=await Promise.all([use("db"),use("user"),use("sample"),use("downloads")]);
  caps.sample=r[2];caps.dl=r[3];
  if(r[2]&&r[2].limits){try{const l=await r[2].limits();caps.img=!!l.images}catch(e){}}
  if(r[0]&&r[1]){
    try{
      const id=await r[1].id();
      if(id){
        docRef=r[0].doc("data/users/"+id+"/save");
        const snap=await docRef.get();
        if(snap.exists){const d=snap.data().state;if(d&&d.upd>(S.upd||0)){S=d;migrate();rollWeek()}}
        sync="cloud";persist();
      }
    }catch(e){}
  }
  if(!$("#sheet").hidden&&!S.pending.length){}else if(S.pending.length&&$("#sheet").hidden)sheetPending();
  if($("#sheet").hidden)render();else{renderHead();renderTabs()}
  if(syncCode())pullRemote();
  if(!S.welcomed&&$("#sheet").hidden)setTimeout(()=>{if($("#sheet").hidden&&!S.welcomed)sheetWelcome()},700);
  if($("#sheet").hidden&&S.welcomed&&backupDue())setTimeout(()=>{if($("#sheet").hidden)sheetBackupReminder()},1200);
}
boot();
})();
